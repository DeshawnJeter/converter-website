<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Quest Converter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero-card">
        <p class="eyebrow">⚡ Unit Quest</p>
        <h1>Convert any unit of measurement!</h1>
        <p class="subtitle">Distance, weight, temperature, volume, and more.</p>
      </header>

      <main class="converter-card">
        <label class="field-label" for="valueInput">Enter a number</label>
        <input id="valueInput" type="number" step="any" placeholder="Example: 10" />

        <label class="field-label" for="categorySelect">Category</label>
        <select id="categorySelect"></select>

        <label class="field-label">Convert from → to</label>
        <div class="unit-row">
          <select id="fromUnit" aria-label="From unit"></select>
          <span class="unit-arrow" aria-hidden="true">→</span>
          <select id="toUnit" aria-label="To unit"></select>
        </div>

        <button id="convertBtn">Convert now!</button>

        <div id="messageBox" class="message-box" role="status" aria-live="polite">Pick a category and convert!</div>

        <div class="result-card">
          <p class="result-label">Your result</p>
          <p id="resultValue" class="result-value">—</p>
          <p id="resultHint" class="result-hint">Choose units and convert.</p>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
